name: sync-release
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest upstream release
        id: upstream
        run: |
          LATEST=$(gh api repos/lingarr-translate/lingarr/releases/latest --jq '.tag_name')
          echo "latest release from upstream: $LATEST"
          echo "tag=$LATEST" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if we already published this version
        id: current
        run: |
          EXISTS=$(gh api repos/${{ github.repository }}/releases/tags/${{ steps.upstream.outputs.tag }} --silent 2>/dev/null && echo "true" || echo "false")
          echo "exists local release: $EXISTS"
          echo "exists=$EXISTS" >> $GITHUB_OUTPUT

      - name: Checkout fix/season-path-per-episode-folder-structure
        if: steps.current.outputs.exists == 'false'
        uses: actions/checkout@v7
        with:
          ref: fix/season-path-per-episode-folder-structure
          fetch-depth: 0
          token: ${{ secrets.GH_PAT  }}
      
      - name: Fetch the exact upstream tag
        if: steps.current.outputs.exists == 'false'
        run: |
          git remote add upstream https://github.com/lingarr-translate/lingarr.git
          git fetch upstream tag ${{ steps.upstream.outputs.tag }}

      - name: Rebase onto that exact tag
        if: steps.current.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rebase ${{ steps.upstream.outputs.tag }}
          git push --force-with-lease origin fix/season-path-per-episode-folder-structure
      
      - uses: docker/login-action@v3
        if: steps.current.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: steps.current.outputs.exists == 'false'
        with:
          context: .
          file: Lingarr.Server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lingarr:${{ steps.upstream.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/lingarr:latest

      - name: Mark as published
        if: steps.current.outputs.exists == 'false'
        run: |
          gh release create ${{ steps.upstream.outputs.tag }} \
            --repo ${{ github.repository }} \
            --title "${{ steps.upstream.outputs.tag }} (with season-path fix)" \
            --notes "Automated build of upstream ${{ steps.upstream.outputs.tag }} plus local season-path per-episode folder structure fix"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


